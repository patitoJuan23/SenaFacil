<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="24" fill="#E0F2FE"/>
  <circle cx="200" cy="110" r="65" fill="#0284C7" opacity="0.15"/>
  <!-- Hand: Index finger up (Number 1) -->
  <g transform="translate(165, 45)">
    <rect x="20" y="60" width="50" height="55" rx="14" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
    <!-- Folded fingers lines -->
    <line x1="20" y1="78" x2="70" y2="78" stroke="#D97706" stroke-width="3"/>
    <line x1="20" y1="94" x2="70" y2="94" stroke="#D97706" stroke-width="3"/>
    <!-- Index finger extended UP -->
    <rect x="22" y="10" width="16" height="60" rx="8" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    <!-- Thumb folded over -->
    <rect x="5" y="65" width="22" height="28" rx="8" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
  </g>
  <text x="200" y="240" font-family="sans-serif" font-weight="bold" font-size="32" fill="#0369A1" text-anchor="middle">1️⃣ NÚMERO 1</text>
  <text x="200" y="270" font-family="sans-serif" font-size="14" fill="#075985" text-anchor="middle">Un solo dedo índice levantado hacia arriba</text>
</svg>
