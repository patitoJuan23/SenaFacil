<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="24" fill="#EFF6FF"/>
  <circle cx="200" cy="110" r="65" fill="#2563EB" opacity="0.15"/>
  <!-- Hand: Open Hand 5 fingers (Number 5) -->
  <g transform="translate(140, 45)">
    <rect x="25" y="60" width="70" height="55" rx="14" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
    <!-- Thumb -->
    <rect x="-5" y="45" width="35" height="15" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3" transform="rotate(-30 10 50)"/>
    <!-- 4 Fingers -->
    <rect x="25" y="10" width="14" height="60" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    <rect x="43" y="5" width="14" height="65" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    <rect x="61" y="8" width="14" height="62" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    <rect x="79" y="15" width="14" height="55" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
  </g>
  <text x="200" y="240" font-family="sans-serif" font-weight="bold" font-size="32" fill="#1D4ED8" text-anchor="middle">5️⃣ NÚMERO 5</text>
  <text x="200" y="270" font-family="sans-serif" font-size="14" fill="#1E40AF" text-anchor="middle">Mano totalmente abierta con los 5 dedos extendidos</text>
</svg>
