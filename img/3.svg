<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="24" fill="#FFF7ED"/>
  <circle cx="200" cy="110" r="65" fill="#EA580C" opacity="0.15"/>
  <!-- Hand: Thumb, Index and Middle up (Number 3) -->
  <g transform="translate(155, 45)">
    <rect x="25" y="60" width="50" height="55" rx="14" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
    <!-- Thumb extended left -->
    <rect x="-10" y="50" width="40" height="15" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3" transform="rotate(-20 10 55)"/>
    <!-- Index finger -->
    <rect x="30" y="10" width="15" height="60" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    <!-- Middle finger -->
    <rect x="52" y="10" width="15" height="60" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
  </g>
  <text x="200" y="240" font-family="sans-serif" font-weight="bold" font-size="32" fill="#C2410C" text-anchor="middle">3️⃣ NÚMERO 3</text>
  <text x="200" y="270" font-family="sans-serif" font-size="14" fill="#9A3412" text-anchor="middle">Pulgar, índice y dedo medio levantados</text>
</svg>
