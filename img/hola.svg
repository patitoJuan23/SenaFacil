<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Person Head Silhouette -->
  <circle cx="200" cy="90" r="45" fill="#3B82F6" opacity="0.15"/>
  <circle cx="200" cy="90" r="35" fill="#2563EB" opacity="0.8"/>
  <path d="M 150 200 C 150 145 250 145 250 200 Z" fill="#2563EB" opacity="0.8"/>

  <!-- Hand open near temple moving side to side -->
  <g transform="translate(250, 60)">
    <!-- Motion lines -->
    <path d="M -30 -10 Q -20 -25 -10 -10 Q 0 -25 10 -10" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
    <!-- Hand -->
    <rect x="-20" y="0" width="40" height="50" rx="12" fill="url(#skin)" stroke="#D97706" stroke-width="3"/>
    <rect x="-24" y="5" width="10" height="30" rx="5" fill="url(#skin)" stroke="#D97706" stroke-width="2"/>
    <rect x="-12" y="-12" width="9" height="32" rx="4" fill="url(#skin)" stroke="#D97706" stroke-width="2"/>
    <rect x="-1" y="-16" width="9" height="36" rx="4" fill="url(#skin)" stroke="#D97706" stroke-width="2"/>
    <rect x="10" y="-12" width="9" height="32" rx="4" fill="url(#skin)" stroke="#D97706" stroke-width="2"/>
    <rect x="20" y="5" width="8" height="25" rx="4" fill="url(#skin)" stroke="#D97706" stroke-width="2"/>
  </g>

  <text x="200" y="255" font-family="sans-serif" font-weight="bold" font-size="28" fill="#1E293B" text-anchor="middle">👋 HOLA</text>
  <text x="200" y="280" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle">Seña en LSC: Mano abierta saludando desde la sien</text>
</svg>
