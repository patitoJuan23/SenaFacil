<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="24" fill="#F0FDF4"/>
  <circle cx="200" cy="110" r="65" fill="#16A34A" opacity="0.15"/>
  <!-- Hand: 4 fingers up, thumb folded (Number 4) -->
  <g transform="translate(145, 45)">
    <rect x="20" y="60" width="70" height="55" rx="14" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
    <!-- 4 Fingers extended -->
    <rect x="20" y="10" width="14" height="60" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    <rect x="38" y="5" width="14" height="65" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    <rect x="56" y="8" width="14" height="62" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    <rect x="74" y="15" width="14" height="55" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    <!-- Thumb folded over palm -->
    <rect x="25" y="70" width="40" height="15" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
  </g>
  <text x="200" y="240" font-family="sans-serif" font-weight="bold" font-size="32" fill="#15803D" text-anchor="middle">4️⃣ NÚMERO 4</text>
  <text x="200" y="270" font-family="sans-serif" font-size="14" fill="#166534" text-anchor="middle">Cuatro dedos levantados guardando el pulgar</text>
</svg>
