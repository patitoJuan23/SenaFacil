<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Pill Accent -->
  <rect x="5" y="10" width="80" height="80" rx="24" fill="url(#logoGrad)" filter="url(#shadow)"/>
  
  <!-- Hand Icon (Friendly waving hand sign) -->
  <g transform="translate(18, 20)" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hand Palm & Fingers -->
    <path d="M 27 48 C 20 48 15 42 15 35 L 15 22 C 15 19.5 17 18 19 18 C 21 18 23 19.5 23 22 L 23 30" fill="none" stroke="#FFF"/>
    <path d="M 23 20 L 23 12 C 23 9.5 25 8 27 8 C 29 8 31 9.5 31 12 L 31 28" stroke="#FFF"/>
    <path d="M 31 15 L 31 10 C 31 7.5 33 6 35 6 C 37 6 39 7.5 39 10 L 39 28" stroke="#FFF"/>
    <path d="M 39 20 L 39 15 C 39 12.5 41 11 43 11 C 45 11 47 12.5 47 15 L 47 32 C 47 42 39 48 30 48 Z" fill="url(#handGrad)" stroke="#FFF"/>
    <!-- Heart In Palm -->
    <path d="M 32 36 C 32 34 30 33 29 34.5 C 28 33 26 34 26 36 C 26 38 29 40 29 40 C 29 40 32 38 32 36 Z" fill="#EF4444" stroke="none"/>
  </g>

  <!-- Sparkle dots -->
  <circle cx="70" cy="22" r="4" fill="#FBBF24"/>
  <circle cx="15" cy="75" r="3" fill="#10B981"/>

  <!-- Brand Typography -->
  <text x="98" y="52" font-family="'Fredoka', 'Outfit', 'Segoe UI', sans-serif" font-weight="700" font-size="34" fill="#1E293B">Seña<tspan fill="#2563EB">Fácil</tspan></text>
  <text x="100" y="72" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#059669" letter-spacing="1">LENGUA DE SEÑAS LSC 🇨🇴</text>
</svg>
