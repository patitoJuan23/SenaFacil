<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="24" fill="#ECFDF5"/>
  <circle cx="200" cy="110" r="40" fill="#10B981" opacity="0.2"/>
  
  <!-- Person side profile with hand touching chin and moving forward -->
  <path d="M 170 80 Q 200 80 200 110 L 200 130 Q 180 140 160 120 Z" fill="#059669" opacity="0.3"/>
  
  <!-- Hand at chin moving outward -->
  <g transform="translate(190, 110)">
    <path d="M 0 0 L 60 40" stroke="#059669" stroke-width="4" stroke-dasharray="6,6" marker-end="url(#arrow)"/>
    <circle cx="0" cy="0" r="18" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    <rect x="0" y="-10" width="35" height="18" rx="6" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
  </g>

  <text x="200" y="250" font-family="sans-serif" font-weight="bold" font-size="28" fill="#065F46" text-anchor="middle">🙏 GRACIAS</text>
  <text x="200" y="278" font-family="sans-serif" font-size="14" fill="#047857" text-anchor="middle">Tocamos la barbilla y llevamos la mano al frente</text>
</svg>
