<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="24" fill="#ECFDF5"/>
  <circle cx="200" cy="110" r="65" fill="#059669" opacity="0.15"/>
  <!-- Hand: Index and Middle finger up in V (Number 2) -->
  <g transform="translate(160, 45)">
    <rect x="20" y="60" width="50" height="55" rx="14" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
    <!-- Index finger -->
    <rect x="18" y="10" width="15" height="60" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3" transform="rotate(-10 25 70)"/>
    <!-- Middle finger -->
    <rect x="52" y="10" width="15" height="60" rx="7" fill="#FBBF24" stroke="#D97706" stroke-width="3" transform="rotate(10 60 70)"/>
    <!-- Thumb folded -->
    <rect x="5" y="65" width="22" height="28" rx="8" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
  </g>
  <text x="200" y="240" font-family="sans-serif" font-weight="bold" font-size="32" fill="#047857" text-anchor="middle">2️⃣ NÚMERO 2</text>
  <text x="200" y="270" font-family="sans-serif" font-size="14" fill="#065F46" text-anchor="middle">Dedos índice y corazón extendidos en forma de V</text>
</svg>
